var it=document.createElement('div');it.className='wmL-m';it.innerHTML='<div class="wmL-x" role="dialog" aria-modal="true"><button class="wmL-c" type="button" aria-label="Fermer">✕</button><div data-s1><h3>Cette maquette vous plaît ?</h3><p>Choisissez la version qui vous intéresse : Webminds vous recontacte pour vous la présenter.</p>'+(C.v.length>1?'<div class="wmL-s">La version préférée</div><div class="wmL-ch">'+ch+'</div>':'')+'<div class="wmL-s">En plus</div><div class="wmL-ch"><label><input type="checkbox" value="Gestion des réseaux sociaux (1 mois offert)"><span>Réseaux sociaux<small>1 mois de gestion offert avec le site</small></span></label></div><div class="wmL-f"><input name="n" placeholder="Votre nom" autocomplete="name"><input name="t" type="tel" inputmode="tel" placeholder="Votre téléphone (facultatif)" autocomplete="tel"></div><button class="wmL-btn wmL-g" type="button" data-w>Envoyer sur WhatsApp</button>'+(C.mail?'<button class="wmL-btn wmL-l" type="button" data-e>Envoyer par e-mail</button>':'')+'</div><div class="wmL-ok" data-s2 hidden><i>✓</i><h3 style="margin:0 0 8px">Merci !</h3><p>Votre choix a bien été transmis à Webminds. Nous vous recontactons très vite.</p><button class="wmL-btn wmL-n" type="button" data-c>Continuer la visite</button></div></div>';
document.body.appendChild(off);document.body.appendChild(it);
var b=document.createElement('button');b.type='button';b.className='wmL-b';b.innerHTML='<b style="font-size:15px">♥</b>Ça m’intéresse';document.body.appendChild(b);
function op(m){off.classList.remove('on');it.classList.remove('on');m.classList.add('on')}
[off,it].forEach(function(m){m.addEventListener('click',function(e){if(e.target===m||e.target.closest('.wmL-c')||e.target.closest('[data-c]'))m.classList.remove('on')})});
b.onclick=function(){op(it)};off.querySelector('[data-i]').onclick=function(){op(it)};
function msg(){var v=(it.querySelector('input[name=wmLv]:checked')||{}).value||C.v[cur][1],x=[].map.call(it.querySelectorAll('input[type=checkbox]:checked'),function(c){return c.value}),n=it.querySelector('[name=n]').value.trim(),t=it.querySelector('[name=t]').value.trim();
 return{v:v,x:x,n:n,t:t,txt:'Bonjour Webminds, la maquette '+C.p+' m’intéresse.\nVersion préférée : '+v+(x.length?'\nEn plus : '+x.join(', '):'')+(n?'\nNom : '+n:'')+(t?'\nTéléphone : '+t:'')+'\nLien : '+location.origin+C.v[cur][0]}}
function mail(m){if(!C.mail)return;try{fetch('https://formsubmit.co/ajax/'+C.mail,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'Maquette '+C.p+' : intéressé ('+m.v+')',Prospect:C.p,Version:m.v,Options:m.x.join(', ')||'-',Nom:m.n||'-',Telephone:m.t||'-',Lien:location.origin+C.v[cur][0],_template:'table',_captcha:'false'})}).catch(function(){})}catch(e){}}
function done(){it.querySelector('[data-s1]').hidden=true;it.querySelector('[data-s2]').hidden=false;ss('wmL-sent','1')}
it.querySelector('[data-w]').onclick=function(){var m=msg();mail(m);done();location.href='https://wa.me/'+C.wa+'?text='+encodeURIComponent(m.txt)};
var e=it.querySelector('[data-e]');if(e)e.onclick=function(){mail(msg());done()};
var sh=ss('wmL-off');addEventListener('scroll',function(){var r=(scrollY+innerHeight)/document.documentElement.scrollHeight;
 if(!sh&&scrollY>500&&r>.3){sh=1;ss('wmL-off','1');op(off)}
 if(!ss('wmL-it')&&!ss('wmL-sent')&&sh&&r>.92&&!off.classList.contains('on')){ss('wmL-it','1');op(it)}},{passive:true});
});})();
</script></body></html>
